# Errata where a printing's text differs from the card's oracle text.
# Keyed by printing_id. The corrected (oracle) value is written to the card;
# the original printed text is preserved on the printing as printed_rules_text.
- printing_id: 83974c7d-6793-5802-9df8-91bd819949f5  # Instability, msw #96
  rules_text:
    as_printed: |
      <strong>After playing this mood</strong> — You may choose two moods from the same opponent. If you do, they
      choose one of those moods and gives it to you, then you give them one of your moods.
    corrected: |
      <strong>After playing this mood</strong> — You may choose two moods from the same opponent. If you do, they
      choose one of those moods and give it to you, then you give them one of your moods.
    note: Typo in the printed card, but the correct English is clear.
